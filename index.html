<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GRE WORD GROUPS · CYBERPUNK</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b10;
      --sf: #12131c;
      --ink: #f0eaff;
      --mu: #b8b0db;
      --ln: #2f2a4a;
      --ac: #ff2a6d;
      --aci: #0a0b10;
      --ok: #05d9e8;
      --no: #ff2a6d;
      --bk: #1a1b2e;
      --bki: #f0eaff;
      --glow: 0 0 8px #ff2a6d, 0 0 20px #ff2a6d88;
      --glow-cyan: 0 0 8px #05d9e8, 0 0 20px #05d9e888;
      --glow-green: 0 0 8px #39ff14, 0 0 20px #39ff1488;
      --glow-yellow: 0 0 8px #f9f002, 0 0 20px #f9f00288;
      --font-mono: "Share Tech Mono", "Noto Sans Bengali", monospace;
      --font-display: "Space Grotesk", "Noto Sans Bengali", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-padding-top: env(safe-area-inset-top,0px); }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.05rem;
      line-height: 1.5;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 42, 109, 0.15), transparent 70%),
        linear-gradient(0deg, rgba(255,42,109,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(5,217,232,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }
    .bn { font-family: "Noto Sans Bengali", var(--font-display); }
    main { max-width: 900px; margin: 0 auto; padding: 10px 8px 60px; width: 100%; }
    
    /* Dynamic Front Page Header */
    .brand-header {
      text-align: center;
      margin: 10px 0 24px;
      position: relative;
    }
    .brand-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--ok);
      border: 1px solid var(--ok);
      padding: 2px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      box-shadow: 0 0 10px rgba(5,217,232,0.3);
      margin-bottom: 8px;
    }
    h1 { font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 700; letter-spacing: -0.02em; text-transform: uppercase; line-height: 1.1; }
    .cyber-h1 {
      color: #fff;
      text-shadow: 0 0 8px var(--ac), 0 0 25px var(--ac), 0 0 50px #ff2a6d55;
      font-family: var(--font-mono);
    }
    .lead { color: var(--mu); margin: 6px 0 16px; font-family: var(--font-mono); font-size: clamp(0.85rem, 2.5vw, 1.05rem); }
    
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, .flashcard-box:focus-visible, select:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 4px;
      box-shadow: var(--glow);
    }

    /* ----- CYBER TILES ----- */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
      gap: 14px; 
    }
    .tile {
      background: linear-gradient(135deg, #12131c, #161726);
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 16px 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
    }
    .tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--ln), transparent);
    }
    .tile:not(.off):hover {
      border-color: var(--ac);
      box-shadow: 0 0 16px #ff2a6d66, 0 8px 25px rgba(0,0,0,0.6), inset 0 0 15px #ff2a6d1a;
      transform: translateY(-3px) scale(1.02);
    }
    .tile:not(.off):hover::before {
      background: linear-gradient(90deg, transparent, var(--ac), transparent);
    }
    .tile-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .tile b {
      font-size: clamp(2.2rem, 5vw, 2.8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      color: #fff;
      text-shadow: 0 0 8px var(--ac), 0 0 18px var(--ac);
      font-family: var(--font-mono);
    }
    .tile .grp-lbl {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.7;
    }
    .tile span { 
      font-size: 0.8rem; 
      color: var(--mu); 
      font-family: var(--font-mono); 
      margin-top: 8px; 
      display: block; 
    }
    .tile .pg-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.06);
      margin-top: 8px;
      border-radius: 2px;
      overflow: hidden;
    }
    .tile .pg {
      height: 100%;
      background: linear-gradient(90deg, var(--ok), #39ff14);
      box-shadow: 0 0 8px var(--ok);
      transition: width 0.3s ease;
    }
    .tile.off { opacity: 0.35; cursor: default; filter: grayscale(1); }

    /* ----- HERO / PROGRESS ----- */
    .hero {
      background: linear-gradient(135deg, rgba(26,27,46,0.9), rgba(10,11,16,0.95));
      border: 1px solid var(--ln);
      border-radius: 8px;
      padding: 22px 24px;
      margin: 0 0 24px;
      font-family: var(--font-mono);
      color: var(--mu);
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8), inset 0 0 30px rgba(255,42,109,0.05);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
      position: relative;
    }
    .hero-metrics {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .hero-stat-main {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .hero b {
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      line-height: 1;
      letter-spacing: -0.03em;
      color: #fff;
      text-shadow: 0 0 12px var(--ok), 0 0 30px #05d9e866;
      font-family: var(--font-mono);
    }
    .hero .pct-badge {
      background: rgba(5,217,232,0.1);
      border: 1px solid var(--ok);
      color: var(--ok);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(5,217,232,0.2);
    }
    .hero .bar {
      background: #12131c;
      height: 12px;
      border-radius: 6px;
      border: 1px solid var(--ln);
      overflow: hidden;
    }
    .hero .bar i {
      display: block; height: 100%;
      background: linear-gradient(90deg, #05d9e8, #39ff14, #ff2a6d);
      box-shadow: 0 0 12px #ff2a6d;
      transition: width 0.5s ease;
    }

    /* ----- TOP BAR ----- */
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .back {
      border: 1px solid var(--ln);
      background: var(--sf);
      border-radius: 4px;
      padding: 8px 18px;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.1s;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    }
    .back:hover { border-color: var(--ac); box-shadow: var(--glow); }
    .tabs {
      display: flex;
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 4px;
      padding: 3px;
      margin-left: auto;
      gap: 2px;
    }
    .tabs button {
      border: 0; background: none; color: var(--mu);
      font-weight: 600; padding: 8px 18px; border-radius: 3px;
      font-family: var(--font-mono); font-size: 0.9rem;
      text-transform: uppercase;
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }
    .tabs button[aria-selected="true"] {
      background: var(--ac);
      color: #fff;
      box-shadow: 0 0 12px var(--ac), 0 0 24px #ff2a6d66;
      text-shadow: 0 0 6px #fff;
    }

    /* ----- STATS ----- */
    .stat { font-size: 1rem; color: var(--mu); margin-bottom: 6px; font-family: var(--font-mono); display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .bar { height: 8px; background: var(--ln); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, #05d9e8, #ff2a6d); box-shadow: 0 0 10px #ff2a6d; transition: width 0.4s; }

    /* ----- FLASHCARD (3D FLIP CONTAINER) ----- */
    .flashcard-wrapper {
      height: clamp(380px, 60vh, 560px);
      width: 100%;
      margin-bottom: 4px;
      perspective: 1000px;
    }
    .flashcard-box {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
      user-select: none;
    }
    .flashcard-box.show-details {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 6px;
      border: 1px solid #2f2a4a;
      color: #fff;
      padding: clamp(16px, 4vw, 28px);
      overflow: auto;
      display: flex;
      flex-direction: column;
      text-align: center;
      gap: 10px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
    }
    .card-face.front {
      background: linear-gradient(160deg, #0a0b10, #12131c);
      box-shadow: inset 0 0 40px #ff2a6d11, 0 0 30px -8px #ff2a6d44;
      align-items: center;
      justify-content: center;
    }
    .card-face.back {
      background: linear-gradient(160deg, #12131c, #1a1b2e);
      box-shadow: inset 0 0 60px #05d9e811, 0 0 30px -8px #05d9e844;
      transform: rotateY(180deg);
      align-items: flex-start;
      text-align: left;
      justify-content: flex-start;
      gap: 12px;
    }
    .card-face.front::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 60px; height: 60px;
      background: linear-gradient(135deg, transparent 50%, #ff2a6d 50%);
      opacity: 0.25;
      pointer-events: none;
    }
    .card-face.back::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--ok), var(--ac));
      box-shadow: 0 0 12px var(--ac);
      pointer-events: none;
    }
    .word-trigger {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-radius: 8px;
      transition: all 0.2s ease;
      width: 100%;
      height: 100%;
    }
    .flashcard-box:hover .term {
      text-shadow: 0 0 12px var(--ac), 0 0 30px var(--ac), 0 0 60px #ff2a6d88;
      transform: scale(1.03);
    }
    .term {
      font-size: clamp(2.4rem, 10vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      word-break: break-word;
      font-family: var(--font-mono);
      color: #fff;
      text-shadow: 0 0 8px var(--ac), 0 0 24px var(--ac), 0 0 48px #ff2a6d66;
      position: relative;
      z-index: 2;
      transition: transform 0.2s ease, text-shadow 0.2s ease, color 0.2s ease;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 4px;
    }
    .term:hover {
      color: var(--ok);
      text-shadow: 0 0 12px var(--ok), 0 0 30px var(--ok);
      transform: scale(1.05);
    }
    .term.flipping-word {
      animation: wordPulseFlip 0.5s ease-in-out;
    }
    @keyframes wordPulseFlip {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }
    .details-term {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 700;
      font-family: var(--font-mono);
      color: #fff;
      text-shadow: 0 0 8px var(--ac), 0 0 18px var(--ac);
      margin-bottom: 2px;
      cursor: pointer;
      transition: transform 0.2s ease, text-shadow 0.2s ease;
    }
    .details-term:hover {
      text-shadow: 0 0 12px var(--ok), 0 0 24px var(--ok);
      transform: scale(1.02);
    }
    .hint {
      font-size: 0.95rem;
      color: #a396cf;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: #1a1b2e;
      padding: 6px 22px;
      border: 1px solid #2f2a4a;
      border-radius: 2px;
      position: relative;
      z-index: 2;
    }
    .pron {
      font-size: 1.4rem;
      color: #cfc6f4;
      font-family: var(--font-mono);
      text-shadow: 0 0 6px #05d9e866;
    }
    .bnm {
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      font-weight: 600;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 0 8px #05d9e8bb, 0 0 20px #05d9e877;
    }
    .row {
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      max-width: 100%;
      width: 100%;
      padding-top: 10px;
      border-top: 1px solid var(--ln);
      font-family: var(--font-mono);
      color: #ffffff;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.4);
    }
    .row i {
      color: #ffffff;
      font-style: italic;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
    }
    .row small {
      display: block;
      opacity: 0.95;
      font-size: 0.82rem;
      font-weight: 700;
      color: #d1c8f8;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .row.syn small { color: #5ef1ff; text-shadow: 0 0 8px #05d9e8; }
    .row.ant small { color: #ff5e8e; text-shadow: 0 0 8px #ff2a6d; }

    /* ----- CHIPS ----- */
    .chip {
      display: inline-block;
      padding: 3px 18px;
      border-radius: 2px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid;
      background: transparent;
    }
    .chip.p { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 10px #05d9e866; }
    .chip.n { border-color: var(--no); color: var(--no); box-shadow: 0 0 10px #ff2a6d66; }
    .chip.z { border-color: #b8b0db; color: #b8b0db; }

    /* ----- BUTTONS ----- */
    .act { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .btn {
      border: 1px solid var(--ln);
      background: var(--sf);
      border-radius: 4px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.15s;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
      box-shadow: 0 0 0 1px #2f2a4a55;
      touch-action: manipulation;
    }
    .btn:hover { border-color: var(--ac); box-shadow: var(--glow); }
    .btn.no { color: var(--no); border-color: #ff2a6d55; }
    .btn.no:hover { box-shadow: 0 0 14px #ff2a6d88, inset 0 0 20px #ff2a6d22; }
    .btn.ok { background: var(--ok); border-color: var(--ok); color: #0a0b10; box-shadow: var(--glow-cyan); }
    .btn.ok:hover { box-shadow: 0 0 20px var(--ok), 0 0 40px #05d9e888; }
    .btn.pr { background: var(--ac); border-color: var(--ac); color: #fff; box-shadow: var(--glow); }
    .btn.pr:hover { box-shadow: 0 0 20px var(--ac), 0 0 40px #ff2a6d88; }

    /* ----- BOX / TEST ----- */
    .box {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: clamp(16px, 4vw, 26px);
      text-align: center;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
      box-shadow: inset 0 0 40px #ff2a6d08, 0 0 30px -12px #ff2a6d44;
    }
    .box h2 { margin: 0 0 8px; color: #fff; text-shadow: 0 0 8px var(--ac); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; font-size: clamp(1.2rem, 4vw, 1.6rem); }
    select {
      font: inherit;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--ln);
      border-radius: 3px;
      padding: 10px 14px;
      margin: 8px 0 16px;
      font-family: var(--font-mono);
      width: 100%;
      max-width: 280px;
      box-shadow: inset 0 0 10px #00000088;
    }
    select:focus { border-color: var(--ac); box-shadow: var(--glow); }
    .q {
      font-size: 1.15rem;
      margin: 0 0 4px;
      font-family: var(--font-mono);
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .qw {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 18px;
      color: #fff;
      text-shadow: 0 0 8px var(--ac), 0 0 24px var(--ac);
      font-family: var(--font-mono);
    }
    .opt {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 4px;
      padding: 14px 16px;
      margin-bottom: 10px;
      font-family: var(--font-mono);
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      transition: all 0.1s;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
      color: #ffffff;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
      touch-action: manipulation;
    }
    .opt:not(:disabled):hover {
      border-color: var(--ac);
      box-shadow: 0 0 12px #ff2a6d44, inset 0 0 20px #ff2a6d11;
      color: #fff;
    }
    .opt.good {
      border-color: var(--ok);
      background: #05d9e822;
      color: #fff;
      box-shadow: 0 0 16px #05d9e866, inset 0 0 30px #05d9e822;
    }
    .opt.bad {
      border-color: var(--no);
      background: #ff2a6d22;
      color: #fff;
      box-shadow: 0 0 16px #ff2a6d66, inset 0 0 30px #ff2a6d22;
    }
    .miss {
      text-align: left;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      font-size: 1.05rem;
      font-family: var(--font-mono);
    }
    .miss li {
      padding: 10px 0;
      border-top: 1px solid var(--ln);
      color: #ffffff;
    }
    .miss li b { color: #fff; text-shadow: 0 0 6px var(--ac); }

    /* Comprehensive Mobile & Responsive Adjustments */
    @media (max-width: 640px) {
      main { padding: 4px 4px 40px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; }
      .tile { padding: 12px 10px; min-height: 95px; }
      .tile b { font-size: 2.2rem; }
      .top { gap: 8px; }
      .tabs { width: 100%; margin-left: 0; justify-content: space-between; }
      .tabs button { flex: 1; padding: 8px 10px; text-align: center; }
      .act { grid-template-columns: 1fr; gap: 10px; }
    }
    @media (max-width: 360px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    }
  </style>
</head>
<body>
<main id="app"></main>
<script>

    if(a === "shuffle"){ queue = shuf(queue); showDetails = false; return cards(); }
    if(a === "restart"){ W(gid).forEach(function(w){ if(S.known[w.g]) delete S.known[w.g][w.t]; }); save(); built = false; return cards(); }
    if(a === "start"){ var s = document.getElementById("tt"); if(s) tType = s.value; startTest(); return test(); }
    if(a === "retry"){ T = null; return test(); }
    if(a === "pick" && T && T.pick == null){
      var q = T.qs[T.i]; T.pick = +el.dataset.i;
      if(T.pick === q.ans) T.sc++; else T.miss.push(q.w);
      return test();
    }
    if(a === "next"){ T.i++; T.pick = null; return test(); }
  });

  document.addEventListener("keydown", function(e){
    if(view !== "group" || mode !== "cards" || !queue.length) return;
    var tg = e.target.tagName;
    if(tg === "SELECT" || tg === "INPUT") return;
    if(e.key === " "){ e.preventDefault(); showDetails = !showDetails; cards(); }
    else if(e.key === "ArrowRight"){ mark(queue[0],true); queue.shift(); showDetails = false; cards(); }
    else if(e.key === "ArrowLeft"){ var w = queue.shift(); queue.splice(Math.min(3,queue.length),0,w); showDetails = false; cards(); }
  });

  load();
  render();
})();
</script>
</body>
</html>
